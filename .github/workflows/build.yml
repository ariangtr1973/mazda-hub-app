name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep a copy with the build
        uses: actions/upload-artifact@v4
        with:
          name: mazda-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Mazda Hub build
          body: Download app-debug.apk below and open it on the tablet to install.
          files: app/build/outputs/apk/debug/app-debug.apk
